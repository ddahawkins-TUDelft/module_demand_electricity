$schema: "https://json-schema.org/draft/2020-12/schema"

description: >
  Schema for user-provided configuration files for the electricity-demand
  module.

type: object

$defs:
  iso_date:
    type: string
    format: date
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
    description: >
      Date in ISO 8601 format (YYYY-MM-DD).

  duration:
    type: string
    pattern: '^[1-9]\d*(h|d|w)$'
    description: >
      Positive duration expressed as an integer followed by h, d, or w,
      for example 3h, 7d, or 1w.

  signed_duration:
    type: string
    pattern: '^-?[1-9]\d*(h|d|w)$'
    description: >
      Non-zero signed duration such as -168h, 168h, -7d, or 1w.

  signed_durations:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      $ref: "#/$defs/signed_duration"
    description: >
      Two or more unique, non-zero signed durations identifying the
      source periods to average.

  hourly_timestamp:
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])([ T]([01]\d|2[0-3]):00)?$'
    description: >
      Hourly timestamp interpreted as UTC. May be written as YYYY-MM-DD
      for midnight or as YYYY-MM-DD HH:00.

  auxiliary_source:
    type: object
    properties:
      country:
        type: string
        pattern: '^[A-Z]{3}$'
        description: >
          ISO alpha-3 country code supplying the source profile.

      start:
        $ref: "#/$defs/hourly_timestamp"

      end:
        $ref: "#/$defs/hourly_timestamp"

      weight:
        type: number
        exclusiveMinimum: 0
        default: 1
        description: >
          Relative weight assigned to this source when source profiles
          are combined using a weighted mean.

    required:
      - country
      - start
      - end

    additionalProperties: false

  auxiliary_sources:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/auxiliary_source"
    description: >
      One or more country-period profiles combined using a weighted mean.

  auxiliary_scaling:
    type: object
    properties:
      method:
        const: match_energy

      target_sources:
        $ref: "#/$defs/auxiliary_sources"
        description: >
          Reference periods whose weighted-mean energy determines the
          energy total of the constructed target profile.

    required:
      - method
      - target_sources

    additionalProperties: false
  
  auxiliary_fill_rule_base:
    type: object
    properties:
      country:
        type: string
        pattern: '^[A-Z]{3}$'
        description: >
          ISO alpha-3 code of the country whose demand values are targeted.

      start:
        $ref: "#/$defs/hourly_timestamp"

      end:
        $ref: "#/$defs/hourly_timestamp"

      scope:
        type: string
        enum:
          - fill_gaps
          - overwrite
        description: >
          Whether the instruction fills only missing values within the
          target period (fill_gaps) or replaces all values in that period
          (overwrite).

      method:
        type: string
        description: >
          Method used to obtain or handle the target demand values.

    required:
      - country
      - start
      - end
      - scope
      - method


  construct_from_sources_rule:
    allOf:
      - $ref: "#/$defs/auxiliary_fill_rule_base"

      - type: object
        properties:
          method:
            const: construct_from_sources

          sources:
            $ref: "#/$defs/auxiliary_sources"

          scaling:
            $ref: "#/$defs/auxiliary_scaling"

        required:
          - sources

    unevaluatedProperties: false


  external_profile_rule:
    allOf:
      - $ref: "#/$defs/auxiliary_fill_rule_base"

      - type: object
        properties:
          method:
            const: external_profile

          path:
            type: string
            minLength: 1
            description: >
              Path to a local CSV containing timestamp and value
              columns for the external series.

        required:
          - path

    unevaluatedProperties: false


  manual_review_rule:
    allOf:
      - $ref: "#/$defs/auxiliary_fill_rule_base"

      - type: object
        properties:
          method:
            const: manual_review

    unevaluatedProperties: false


  leave_missing_rule:
    allOf:
      - $ref: "#/$defs/auxiliary_fill_rule_base"

      - type: object
        properties:
          method:
            const: leave_missing

    unevaluatedProperties: false

  auxiliary_fill_rule:
    oneOf:
      - $ref: "#/$defs/construct_from_sources_rule"
      - $ref: "#/$defs/external_profile_rule"
      - $ref: "#/$defs/manual_review_rule"
      - $ref: "#/$defs/leave_missing_rule"
  
  auxiliary_basic_cleaning:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
        description: >
          Apply the configured basic gap-filling rules to auxiliary
          demand data before it is used for advanced profile construction.

    required:
      - enabled

    additionalProperties: false


  auxiliary_data:
    type: object
    properties:
      basic_cleaning:
        $ref: "#/$defs/auxiliary_basic_cleaning"

    required:
      - basic_cleaning

    additionalProperties: false

  gap_filling_rule_base:
    type: object
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_]+$'
        description: >
          Unique identifier for this configured gap-filling rule. Used for
          provenance reporting and cleaning-method ranking.

      method:
        type: string
        description: >
          Gap-filling method applied by this rule.

    required:
      - name
      - method

  linear_interpolation_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: linear_interpolation

          max_gap:
            $ref: "#/$defs/duration"

        required:
          - max_gap
    unevaluatedProperties: false

  average_periods_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: average_periods

          max_gap:
            $ref: "#/$defs/duration"

          source_offsets:
            $ref: "#/$defs/signed_durations"

        required:
          - max_gap
          - source_offsets
    unevaluatedProperties: false

  copy_period_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: copy_period

          max_gap:
            $ref: "#/$defs/duration"

          source_offset:
            $ref: "#/$defs/signed_duration"

          require_complete_source:
            type: boolean
            default: true
            description: >
              Require all source-period values needed for a gap to be
              available before filling that gap.

        required:
          - max_gap
          - source_offset

    unevaluatedProperties: false

  gap_filling_rule:
    oneOf:
      - $ref: "#/$defs/linear_interpolation_rule"
      - $ref: "#/$defs/average_periods_rule"
      - $ref: "#/$defs/copy_period_rule"


properties:
  temporal_scope:
    type: object
    description: >
      End-exclusive temporal scope for the electricity-demand time series.

    properties:
      start:
        $ref: "#/$defs/iso_date"

      end:
        $ref: "#/$defs/iso_date"

    required:
      - start
      - end

    additionalProperties: false

  load_sources:
    type: array
    description: >
      Ordered electricity-demand sources. Sources listed earlier have
      higher priority when more than one source supplies the same value.

    minItems: 1
    uniqueItems: true

    items:
      type: string
      enum:
        - entsoe_api
        - neso
        - opsd_api

  gap_filling:
    type: object
    description: >
      Gap-filling configuration. Basic rules are applied in order using
      data within the requested temporal scope. Advanced mode additionally
      supports auxiliary-data planning and filling.

    properties:
      mode:
        type: string
        enum:
          - off
          - basic
          - advanced
        default: basic
        description: >
          Gap-filling mode. 'off' disables gap filling, 'basic' applies
          configured deterministic rules, and 'advanced' additionally
          produces and applies auxiliary-fill instructions.

      basic:
        type: object
        properties:
          rules:
            type: array
            default: []
            items:
              $ref: "#/$defs/gap_filling_rule"
            description: >
              Ordered deterministic gap-filling rules.

        required:
          - rules

        additionalProperties: false

      advanced:
        type: object
        properties:
          auxiliary_data:
            $ref: "#/$defs/auxiliary_data"

          overrides:
            type: object
            default: {}
            description: >
              Named country-period instructions that override general
              advanced gap-handling decisions.
            propertyNames:
              pattern: '^[a-z0-9_]+$'
            additionalProperties:
              $ref: "#/$defs/auxiliary_fill_rule"

        required:
          - auxiliary_data
          - overrides

        additionalProperties: false


    required:
      - mode
      - basic
      - advanced

    additionalProperties: false


required:
  - temporal_scope
  - load_sources
  - gap_filling

additionalProperties: false