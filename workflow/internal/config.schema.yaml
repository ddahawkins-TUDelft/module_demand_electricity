$schema: "https://json-schema.org/draft/2020-12/schema"

description: >
  Schema for user-provided configuration files for the electricity-demand
  module.

type: object

$defs:
  iso_date:
    type: string
    format: date
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
    description: >
      Date in ISO 8601 format (YYYY-MM-DD).

  duration:
    type: string
    pattern: '^[1-9]\d*(h|d|w)$'
    description: >
      Positive duration expressed as an integer followed by h, d, or w,
      for example 3h, 7d, or 1w.

  signed_duration:
    type: string
    pattern: '^-?[1-9]\d*(h|d|w)$'
    description: >
      Non-zero signed duration such as -168h, 168h, -7d, or 1w.

  signed_durations:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      $ref: "#/$defs/signed_duration"
    description: >
      Two or more unique, non-zero signed durations identifying the
      source periods to average.

  gap_filling_rule_base:
    type: object
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_]+$'
        description: >
          Unique identifier for this configured gap-filling rule. Used for
          provenance reporting and cleaning-method ranking.

      method:
        type: string
        description: >
          Gap-filling method applied by this rule.

    required:
      - name
      - method

  linear_interpolation_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: linear_interpolation

          max_gap:
            $ref: "#/$defs/duration"

        required:
          - max_gap
    unevaluatedProperties: false

  average_periods_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: average_periods

          max_gap:
            $ref: "#/$defs/duration"

          source_offsets:
            $ref: "#/$defs/signed_durations"

        required:
          - max_gap
          - source_offsets
    unevaluatedProperties: false

  copy_period_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"

      - type: object
        properties:
          method:
            const: copy_period

          max_gap:
            $ref: "#/$defs/duration"

          source_offset:
            $ref: "#/$defs/signed_duration"

          require_complete_source:
            type: boolean
            default: true
            description: >
              Require all source-period values needed for a gap to be
              available before filling that gap.

        required:
          - max_gap
          - source_offset

    unevaluatedProperties: false

  gap_filling_rule:
    oneOf:
      - $ref: "#/$defs/linear_interpolation_rule"
      - $ref: "#/$defs/average_periods_rule"
      - $ref: "#/$defs/copy_period_rule"


properties:
  temporal_scope:
    type: object
    description: >
      End-exclusive temporal scope for the electricity-demand time series.

    properties:
      start:
        $ref: "#/$defs/iso_date"

      end:
        $ref: "#/$defs/iso_date"

    required:
      - start
      - end

    additionalProperties: false

  load_sources:
    type: array
    description: >
      Ordered electricity-demand sources. Sources listed earlier have
      higher priority when more than one source supplies the same value.

    minItems: 1
    uniqueItems: true

    items:
      type: string
      enum:
        - entsoe_api
        - neso
        - opsd_api

  gap_filling:
    type: object
    description: >
      Ordered gap-filling configuration. Rules are applied in the order
      provided, and that order contributes to cleaning-method ranking.

    properties:
      mode:
        type: string
        enum:
          - off
          - basic
          - advanced
        default: basic
        description: >
          Gap-filling mode. 'off' disables gap filling, 'basic' applies
          configured rules using data available within the requested temporal
          scope, and 'advanced' additionally uses auxiliary-data planning and
          advanced filling strategies.

      rules:
        type: array
        default: []
        items:
          $ref: "#/$defs/gap_filling_rule"

    required:
      - mode
      - rules

    additionalProperties: false


required:
  - temporal_scope
  - load_sources
  - gap_filling

additionalProperties: false