$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."

$defs:
  iso_date:
    type: string
    format: date
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
    description: "Date in ISO 8601 format (YYYY-MM-DD)."

  duration:
    type: string
    pattern: '^[1-9]\d*(h|d|w)$'
    description: >
      Positive duration expressed as an integer followed by h, d, or w,
      for example 3h, 7d, or 1w.
  signed_duration:
    type: string
    pattern: '^-?[1-9]\d*(h|d|w)$'
    description: >
      Non-zero signed duration such as -168h, 168h, -7d, or 1w.

  linear_interpolation_rule:
      type: object
      additionalProperties: false
      properties:
        method:
          const: linear_interpolation
        max_gap:
          $ref: "#/$defs/duration"
      required:
        - method
        - max_gap

  copy_period_rule:
    type: object
    additionalProperties: false
    properties:
      method:
        const: copy_period
      max_gap:
        $ref: "#/$defs/duration"
      source_offset:
        $ref: "#/$defs/signed_duration"
      require_complete_source:
        type: boolean
        default: true
    required:
      - method
      - max_gap
      - source_offset

  gap_filling_rule:
    oneOf:
      - $ref: "#/$defs/linear_interpolation_rule"
      - $ref: "#/$defs/copy_period_rule"

type: object
additionalProperties: false

properties:
  temporal_scope:
    type: object
    description: "The temporal scope of the simulation."
    properties:
      start:
        $ref: "#/$defs/iso_date"
        description: "Start date the simulation in ISO 8601 format (YYYY-MM-DD)."
      end:
        $ref: "#/$defs/iso_date"
        description: "End date the simulation in ISO 8601 format (YYYY-MM-DD)."
    required:
      - start
      - end

  use_load:
    type: string
    description: "The source of load data to use in the simulation. Options are 'entsoe_api' or 'entsoe_opsd'."
    enum:
      - "entsoe_api"
      - "entsoe_opsd"

  gap_filling:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean

      rules:
        type: array
        description: Gap-filling rules applied in the order listed.
        items:
          $ref: "#/$defs/gap_filling_rule"

    required:
      - enabled
      - rules

    allOf:
      - if:
          properties:
            enabled:
              const: true
          required:
            - enabled
        then:
          properties:
            rules:
              minItems: 1
