$schema: "https://json-schema.org/draft/2020-12/schema"
description: "Schema for user-provided configuration files."

$defs:
  iso_date:
    type: string
    format: date
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
    description: "Date in ISO 8601 format (YYYY-MM-DD)."

  duration:
    type: string
    pattern: '^[1-9]\d*(h|d|w)$'
    description: >
      Positive duration expressed as an integer followed by h, d, or w,
      for example 3h, 7d, or 1w.

  signed_duration:
    type: string
    pattern: '^-?[1-9]\d*(h|d|w)$'
    description: >
      Non-zero signed duration such as -168h, 168h, -7d, or 1w.

  gap_filling_rule_base:
    type: object
    properties:
      name:
        type: string
        pattern: '^[a-z0-9_]+$'
        description: >
          Unique identifier for this configured gap-filling rule. Used for
          provenance reporting and cleaning-method ranking.
      method:
        type: string
        description: Gap-filling method applied by this rule.
    required:
      - name
      - method

  linear_interpolation_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"
      - type: object
        properties:
          method:
            const: linear_interpolation
          max_gap:
            $ref: "#/$defs/duration"
        required:
          - max_gap
    unevaluatedProperties: false

  copy_period_rule:
    allOf:
      - $ref: "#/$defs/gap_filling_rule_base"
      - type: object
        properties:
          method:
            const: copy_period
          max_gap:
            $ref: "#/$defs/duration"
          source_offset:
            $ref: "#/$defs/signed_duration"
          require_complete_source:
            type: boolean
            default: true
        required:
          - max_gap
          - source_offset
    unevaluatedProperties: false

  gap_filling_rule:
    oneOf:
      - $ref: "#/$defs/linear_interpolation_rule"
      - $ref: "#/$defs/copy_period_rule"