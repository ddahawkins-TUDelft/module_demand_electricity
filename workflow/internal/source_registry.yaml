# This registry defines the data sources currently integrated into
# Module Demand Electricity.
#
# Sources may optionally declare:
# - display_name: human-readable name used for display and plotting.
# - temporal_scope: valid source interval [start, end).
#   Either bound may be omitted to indicate no declared bound.
# - contexts: eligible contexts for this source.
#   If omitted or empty, no context restriction is declared.

