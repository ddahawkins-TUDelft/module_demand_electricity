# A minimal example of how to configure this module
temporal_scope:
  start: "2017-01-01"
  end: "2018-01-01"

# Provide a list of sources in priority order.
# Options: entsoe_api, opsd_api
load_sources:
  - entsoe_api
  - neso
  - opsd_api

# Gap-filling rules are applied in the listed order.
gap_filling:
  enabled: true
  rules:
    - name: interpolate_short_gaps
      method: linear_interpolation
      max_gap: 3h

    - name: copy_previous_week
      method: copy_period
      max_gap: 168h
      source_offset: -168h