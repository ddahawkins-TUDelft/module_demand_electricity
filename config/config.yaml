# A minimal example of how to configure this module
temporal_scope:
  start: "2017-01-01"
  end: "2018-01-01"

# Provide a list of sources in priority order.
# Options: entsoe_api, opsd_api
load_sources:
  - entsoe_api
  - neso
  - opsd_api

# Gap-filling rules are applied in the listed order.
gap_filling:
  #sets the data cleaning mode. Options: off,basic,Advanced
  mode: advanced
  rules:
    # interpolates across tiny gaps where <=3 hours are missing
    - name: interpolate_short_gaps
      method: linear_interpolation
      max_gap: 3h
    # takes the average of the same hour, one week in the future and one week in the past
    - name: average_adjacent_weeks
      method: average_periods
      max_gap: 326h
      source_offsets:
        - -7d
        - 7d
    #copies from the previous period, maximum of up to 1 week
    - name: copy_previous_week
      method: copy_period
      max_gap: 168h
      source_offset: -168h
    #copies from the following period, maximum of up to 1 week
    - name: copy_following_week
      method: copy_period
      max_gap: 168h
      source_offset: 168h