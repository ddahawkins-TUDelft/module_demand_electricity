integration_test:
  temporal_scope:
    start: "2021-01-01"
    end: "2021-12-31"
  # provide a list of sources and set their priority order. Options include: entsoe_api, opsd_api
  load_sources: 
    - entsoe_api
    - neso
    - opsd_api

  gap_filling:
      enabled: true
      rules:
        - name: interpolate_short_gaps
          method: linear_interpolation
          max_gap: 3h
        - name: copy_previous_week
          method: copy_period
          max_gap: 168h
          source_offset: -168h