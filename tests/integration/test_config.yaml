integration_test:
  temporal_scope:
    start: "2017-01-01"
    end: "2017-01-03"
  # provide a list of sources and set their priority order. Options include: entsoe_api, opsd_api
  load_sources: 
    - entsoe_api
    - opsd_api

  gap_filling:
      enabled: true
      rules:
        - method: linear_interpolation
          max_gap: 3h
        - method: copy_period
          max_gap: 168h
          source_offset: -168h