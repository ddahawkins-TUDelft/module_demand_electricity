integration_test:
  temporal_scope:
    start: "2022-01-01"
    end: "2025-01-01"
  # provide a list of sources and set their priority order. Options include: entsoe_api, opsd_api
  load_sources: 
    - entsoe_api
    - neso
    - opsd_api

  gap_filling:
    # Sets the data-cleaning mode. Options: off, basic, advanced.
    mode: advanced

    basic:
      # Basic gap-filling rules are applied in the listed order.
      rules:
        # Interpolates across tiny gaps where no more than 3 hours are missing.
        - name: interpolate_short_gaps
          method: linear_interpolation
          max_gap: 3h

        # Takes the average of the same hour one week earlier and later.
        - name: average_adjacent_weeks
          method: average_periods
          max_gap: 326h
          source_offsets:
            - -7d
            - 7d

        # Copies from the previous week for gaps of up to one week.
        - name: copy_previous_week
          method: copy_period
          max_gap: 168h
          source_offset: -168h

        # Copies from the following week for gaps of up to one week.
        - name: copy_following_week
          method: copy_period
          max_gap: 168h
          source_offset: 168h

    advanced:
      auxiliary_data:
        basic_cleaning:
          enabled: true

      # Explicit country-period instructions for unresolved cases.
      overrides:

        build_ALB_from_GBR_ALB_winter:
          country: ALB
          start: "2022-01-01"
          end: "2022-02-01"
          scope: fill_gaps_within_period
          method: construct_from_sources
          sources:
            - country: GBR
              start: "2024-01-01"
              end: "2024-02-01"
              weight: 1
          scaling:
            method: match_energy
            target_sources:
              - country: ALB
                start: "2024-01-01"
                end: "2024-02-01"
                weight: 1
        build_ALB_from_GBR_summer:
          country: ALB
          start: "2022-05-01"
          end: "2022-06-01"
          scope: fill_gaps_within_period
          method: construct_from_sources
          sources:
            - country: GBR
              start: "2022-05-01"
              end: "2022-06-01"
              weight: 1
          scaling:
            method: match_energy
            target_sources:
              - country: ALB
                start: "2024-05-01"
                end: "2024-06-01"
                weight: 1